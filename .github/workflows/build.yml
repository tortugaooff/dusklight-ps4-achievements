name: Dusklight PS4 r25 offline
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build python3-venv bison flex pkg-config \
            python3-mako python3-yaml python3-packaging python3-ply libxml2-dev zstd glslang-tools spirv-tools
          if ! command -v clang-21 >/dev/null || ! command -v llvm-readelf-21 >/dev/null; then
            curl -fsSL --retry 3 https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
            sudo bash "$RUNNER_TEMP/llvm.sh" 21
            sudo apt-get install -y llvm-21
          fi
          python3 -m venv --system-site-packages "$RUNNER_TEMP/mesa-tools"
          "$RUNNER_TEMP/mesa-tools/bin/python" -m pip install meson==1.7.2
          "$RUNNER_TEMP/mesa-tools/bin/meson" --version
          echo "$RUNNER_TEMP/mesa-tools/bin" >> "$GITHUB_PATH"
          df -h .
      - name: Build Orbis executable and validate ELF layout
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS: '3'
        run: bash ./build-cloud.sh "$RUNNER_TEMP/dusklight-r25"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dusklight-ps4-offline
          path: |
            ${{ runner.temp }}/dusklight-r25/cloud-output/eboot.bin
            ${{ runner.temp }}/dusklight-r25/cloud-output/default-config.json
            ${{ runner.temp }}/dusklight-r25/cloud-output/elf-layout.txt
            ${{ runner.temp }}/dusklight-r25/cloud-output/source-revisions.txt
            ${{ runner.temp }}/dusklight-r25/cloud-output/LICENSE
            ${{ runner.temp }}/dusklight-r25/cloud-output/THIRD_PARTY_LICENSES.txt
            ${{ runner.temp }}/dusklight-r25/cloud-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
